@if (open() && phase() === 'form') {
  <div class="add-vehicle-dialog__backdrop" (click)="onBackdropClick($event)">
    <div
      class="add-vehicle-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="add-vehicle-dialog-title"
      aria-describedby="add-vehicle-dialog-desc"
      (click)="$event.stopPropagation()"
    >
      <div class="add-vehicle-dialog__content">
        <div class="add-vehicle-dialog__header">
          <h2 id="add-vehicle-dialog-title" class="add-vehicle-dialog__title">Add Vehicle</h2>
          <p id="add-vehicle-dialog-desc" class="add-vehicle-dialog__subtitle">
            Enter your vehicle plate number and the car owner’s full name.
          </p>
        </div>

        <form
          class="add-vehicle-dialog__form"
          [formGroup]="form"
          (ngSubmit)="onSave()"
          novalidate
        >
          <div class="add-vehicle-dialog__field">
            <input
              id="avd-plate"
              type="text"
              class="add-vehicle-dialog__input"
              formControlName="plateNo"
              placeholder=" "
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-required="true"
            />
            <label class="add-vehicle-dialog__input-label" for="avd-plate">Plate No.</label>
          </div>

          <div class="add-vehicle-dialog__field">
            <input
              id="avd-owner"
              type="text"
              class="add-vehicle-dialog__input"
              formControlName="ownerFullName"
              placeholder=" "
              autocomplete="name"
              aria-required="true"
            />
            <label class="add-vehicle-dialog__input-label" for="avd-owner">Car Owner’s Full Name</label>
          </div>
        </form>
      </div>

      <div class="add-vehicle-dialog__actions">
        <button type="button" class="add-vehicle-dialog__btn add-vehicle-dialog__btn--cancel" (click)="dismiss()">
          Cancel
        </button>
        <button
          type="button"
          class="add-vehicle-dialog__btn add-vehicle-dialog__btn--save"
          [class.add-vehicle-dialog__btn--save-enabled]="canSave()"
          [disabled]="!canSave() || saving()"
          (click)="onSave()"
        >
          {{ saving() ? 'Saving…' : 'Save Vehicle' }}
        </button>
      </div>
    </div>
  </div>
}

<app-add-vehicle-success-dialog
  [open]="open() && phase() === 'success'"
  (closed)="onSuccessClose()"
/>
