<div class="quotation-prefs-page">
  <div class="app-route-fade-target quotation-prefs-page__fade">
    <div class="quotation-prefs-page__chrome">
      <header class="quotation-prefs-page__appbar" aria-label="Get new quote navigation">
        <button type="button" class="quotation-prefs-page__back" aria-label="Back" (click)="goBack()">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
          </svg>
        </button>
        <h1 class="quotation-prefs-page__title">Get New Quote</h1>
      </header>
    </div>

    <main class="quotation-prefs-page__main">
      <div class="quotation-prefs-page__tabs" role="tablist" aria-label="Customer type">
        @for (tab of customerTabs; track tab.id) {
          <button
            type="button"
            class="quotation-prefs-page__tab"
            [class.quotation-prefs-page__tab--active]="activeCustomerTab() === tab.id"
            role="tab"
            [attr.aria-selected]="activeCustomerTab() === tab.id"
            (click)="setCustomerTab(tab.id)"
          >
            <span class="quotation-prefs-page__tab-label">{{ tab.label }}</span>
            @if (activeCustomerTab() === tab.id) {
              <span class="quotation-prefs-page__tab-indicator" aria-hidden="true"></span>
            }
          </button>
        }
      </div>

      @if (showMalaysianForm()) {
        <section class="quotation-prefs-page__group" aria-labelledby="e-hailing-label">
          <div class="quotation-prefs-page__info-label" id="e-hailing-label">
            <img
              [appCachedAsset]="infoIconSrc"
              class="quotation-prefs-page__info-icon"
              width="18"
              height="18"
              alt=""
              aria-hidden="true"
            />
            <span>The car is used for e-hailing services:</span>
          </div>
          <div class="quotation-prefs-page__options" role="radiogroup" aria-labelledby="e-hailing-label">
            <label class="quotation-prefs-page__radio">
              <input
                type="radio"
                name="eHailingUsage"
                value="yes"
                [checked]="eHailingUsage() === 'yes'"
                (change)="setEHailingUsage('yes')"
              />
              <span class="quotation-prefs-page__radio-mark" aria-hidden="true"></span>
              <span class="quotation-prefs-page__radio-label">Yes</span>
            </label>
            <label class="quotation-prefs-page__radio">
              <input
                type="radio"
                name="eHailingUsage"
                value="no"
                [checked]="eHailingUsage() === 'no'"
                (change)="setEHailingUsage('no')"
              />
              <span class="quotation-prefs-page__radio-mark" aria-hidden="true"></span>
              <span class="quotation-prefs-page__radio-label">No</span>
            </label>
          </div>
        </section>

        <section class="quotation-prefs-page__group" aria-labelledby="marital-status-label">
          <div class="quotation-prefs-page__info-label" id="marital-status-label">
            <img
              [appCachedAsset]="infoIconSrc"
              class="quotation-prefs-page__info-icon"
              width="18"
              height="18"
              alt=""
              aria-hidden="true"
            />
            <span>Marital status:</span>
          </div>
          <div class="quotation-prefs-page__options" role="radiogroup" aria-labelledby="marital-status-label">
            <label class="quotation-prefs-page__radio">
              <input
                type="radio"
                name="maritalStatus"
                value="single"
                [checked]="maritalStatus() === 'single'"
                (change)="setMaritalStatus('single')"
              />
              <span class="quotation-prefs-page__radio-mark" aria-hidden="true"></span>
              <span class="quotation-prefs-page__radio-label">Single</span>
            </label>
            <label class="quotation-prefs-page__radio">
              <input
                type="radio"
                name="maritalStatus"
                value="married"
                [checked]="maritalStatus() === 'married'"
                (change)="setMaritalStatus('married')"
              />
              <span class="quotation-prefs-page__radio-mark" aria-hidden="true"></span>
              <span class="quotation-prefs-page__radio-label">Married</span>
            </label>
          </div>
        </section>

        <section class="quotation-prefs-page__group" aria-labelledby="contact-method-label">
          <div class="quotation-prefs-page__info-label" id="contact-method-label">
            <img
              [appCachedAsset]="infoIconSrc"
              class="quotation-prefs-page__info-icon"
              width="18"
              height="18"
              alt=""
              aria-hidden="true"
            />
            <span>Preferred contact method:</span>
          </div>
          <div class="quotation-prefs-page__options" role="radiogroup" aria-labelledby="contact-method-label">
            <label class="quotation-prefs-page__radio">
              <input
                type="radio"
                name="contactMethod"
                value="email"
                [checked]="contactMethod() === 'email'"
                (change)="setContactMethod('email')"
              />
              <span class="quotation-prefs-page__radio-mark" aria-hidden="true"></span>
              <span class="quotation-prefs-page__radio-label">Email</span>
            </label>
            <label class="quotation-prefs-page__radio">
              <input
                type="radio"
                name="contactMethod"
                value="whatsapp"
                [checked]="contactMethod() === 'whatsapp'"
                (change)="setContactMethod('whatsapp')"
              />
              <span class="quotation-prefs-page__radio-mark" aria-hidden="true"></span>
              <span class="quotation-prefs-page__radio-label">Whatsapp</span>
            </label>
          </div>
        </section>
      }
    </main>

    <footer class="quotation-prefs-page__footer" aria-label="Quote actions">
      <div class="quotation-prefs-page__cta">
        <button
          type="button"
          class="quotation-prefs-page__cta-btn"
          [class.quotation-prefs-page__cta-btn--disabled]="!canSubmit()"
          [disabled]="!canSubmit()"
          (click)="findBestPrices()"
        >
          Find the BEST prices!
        </button>
        <div class="quotation-prefs-page__safe">
          <img
            appCachedAsset="/assets/my-vehicles/lock.svg"
            class="quotation-prefs-page__safe-icon"
            width="12"
            height="16"
            alt=""
            aria-hidden="true"
          />
          <span>Your data is safe with us.</span>
        </div>
      </div>
    </footer>
  </div>

  <a
    class="quotation-prefs-page__whatsapp"
    [href]="whatsappHref"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contact us on WhatsApp"
  >
    <span class="quotation-prefs-page__whatsapp-inner">
      <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="#fff"
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
        />
      </svg>
    </span>
  </a>
</div>
