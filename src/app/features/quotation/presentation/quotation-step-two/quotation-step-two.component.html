<div class="quotation-page quotation-page--select-vehicle">
  <div class="app-route-fade-target quotation-page__fade">
    <div class="quotation-page__chrome">
      <header class="quotation-page__appbar" aria-label="Get new quote navigation">
        <button type="button" class="quotation-page__back" aria-label="Back" (click)="goBack()">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
          </svg>
        </button>
        <h1 class="quotation-page__title">Get New Quote</h1>
      </header>
    </div>

    <main class="quotation-page__main">
      <section class="quotation-page__intro" aria-label="Vehicle selection intro">
        <div class="quotation-page__intro-head">
          <h2 class="quotation-page__intro-title">
            <span>Which vehicle is</span>
            <span>this for?</span>
          </h2>
          <button type="button" class="quotation-page__add-vehicle" (click)="addVehicle()">
            Add Vehicle
          </button>
        </div>
        <p class="quotation-page__intro-copy">
          Select a saved vehicle to speed things up. If your vehicle isn't listed, just tap
          <strong>Continue</strong>
          to add it manually.
        </p>
      </section>

      <section class="quotation-vehicle-list" aria-label="Saved vehicles">
        @for (vehicle of vehicles(); track vehicle.id) {
          <button
            type="button"
            class="quotation-vehicle"
            [class.quotation-vehicle--selected]="selectedVehicleId() === vehicle.id"
            (click)="selectVehicle(vehicle.id)"
          >
            <span class="quotation-vehicle__thumb">
              <img [appCachedAsset]="vehicle.imageSrc" width="50" height="47" alt="" aria-hidden="true" />
            </span>
            <span class="quotation-vehicle__plate">{{ vehicle.plate }}</span>
            <span
              class="quotation-vehicle__radio"
              [class.quotation-vehicle__radio--checked]="selectedVehicleId() === vehicle.id"
              aria-hidden="true"
            ></span>
          </button>
        }
      </section>
    </main>

    <footer class="quotation-page__footer" aria-label="Quote actions">
      <div class="quotation-cta" aria-label="Continue quote">
        <button
          type="button"
          class="quotation-cta__btn"
          [class.quotation-cta__btn--disabled]="!canContinue()"
          [disabled]="!canContinue()"
          (click)="continue()"
        >
          Continue
        </button>
        <div class="quotation-cta__safe">
          <img
            appCachedAsset="/assets/my-vehicles/lock.svg"
            class="quotation-cta__safe-icon"
            width="12"
            height="16"
            alt=""
            aria-hidden="true"
          />
          <span>Your data is safe with us.</span>
        </div>
      </div>
    </footer>
  </div>
</div>
