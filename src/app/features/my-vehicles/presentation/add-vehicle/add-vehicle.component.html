<div class="add-vehicle-page">
  <div class="app-route-fade-target">
    <div class="add-vehicle-page__chrome">
      <app-page-chrome title="Add New Vehicle" (back)="goBack()" />
    </div>

    <main id="main-content" class="add-vehicle-page__main">
      <header class="add-vehicle-page__intro">
        <h2 class="add-vehicle-page__title">Add Vehicle</h2>
        <p class="add-vehicle-page__subtitle">
          Enter your vehicle plate number and the car owner’s full name.
        </p>
      </header>

      <form class="add-vehicle-page__form" [formGroup]="form" (ngSubmit)="onSave()" novalidate>
        <div class="add-vehicle-page__field">
          <input
            id="av-plate"
            type="text"
            class="add-vehicle-page__input"
            formControlName="plateNo"
            placeholder=" "
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            aria-required="true"
          />
          <label class="add-vehicle-page__input-label" for="av-plate">Plate No.</label>
        </div>

        <div class="add-vehicle-page__field">
          <input
            id="av-owner"
            type="text"
            class="add-vehicle-page__input"
            formControlName="ownerFullName"
            placeholder=" "
            autocomplete="name"
            aria-required="true"
          />
          <label class="add-vehicle-page__input-label" for="av-owner">Car Owner’s Full Name</label>
        </div>
      </form>
    </main>

    <footer class="add-vehicle-page__footer" aria-label="Save vehicle actions">
      <div class="add-vehicle-page__cta">
        <button
          type="button"
          class="add-vehicle-page__save-btn"
          [class.add-vehicle-page__save-btn--enabled]="canSave()"
          [disabled]="!canSave() || saving()"
          (click)="onSave()"
        >
          {{ saving() ? 'Saving…' : 'Save Vehicle' }}
        </button>
        <div class="add-vehicle-page__safe">
          <img
            appCachedAsset="/assets/my-vehicles/lock.svg"
            class="add-vehicle-page__safe-icon"
            width="12"
            height="16"
            alt=""
            aria-hidden="true"
          />
          <span>Your data is safe with us.</span>
        </div>
      </div>
    </footer>
  </div>
</div>
