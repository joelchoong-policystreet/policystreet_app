<section class="quick-actions" aria-labelledby="quick-actions-heading">
  <h2 id="quick-actions-heading" class="quick-actions__title">Quick Actions</h2>
  <div class="quick-actions__buttons">
    <button type="button" class="quick-actions__btn" (click)="goQuotation()">
      <span class="quick-actions__icon">
        <img appCachedAsset="/assets/home/quick-action-request-quote.svg" width="40" height="40" alt="" aria-hidden="true" />
      </span>
      <span class="quick-actions__label">Request New Quote</span>
    </button>
    <button type="button" class="quick-actions__btn" (click)="goContactSupport()">
      <span class="quick-actions__icon">
        <img appCachedAsset="/assets/home/quick-action-contact-support.svg" width="40" height="40" alt="" aria-hidden="true" />
      </span>
      <span class="quick-actions__label">Contact Support</span>
    </button>
    <button type="button" class="quick-actions__btn" (click)="goMyVehicles()">
      <span class="quick-actions__icon">
        <img appCachedAsset="/assets/home/quick-action-add-vehicle.svg" width="40" height="40" alt="" aria-hidden="true" />
      </span>
      <span class="quick-actions__label">Add New Vehicle</span>
    </button>
  </div>
</section>
